<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alunos</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h1>Cadastro de Aluno</h1>

    <form id="formAluno" class="form">
      <input type="hidden" id="alunoId" />

      <input type="text" id="nome" placeholder="Nome" required />
      <input type="email" id="email" placeholder="E-mail" required />
      <input type="text" id="cpf" placeholder="CPF" required />
      <input type="text" id="rg" placeholder="RG" />
      <input type="text" id="endereco" placeholder="Endereço" />
      <input type="text" id="curso" placeholder="Curso" required />

      <select id="instituicaoId" required>
        <option value="">Selecione a instituição</option>
      </select>

      <button type="submit" class="btn">Salvar</button>
      <a href="/" class="btn secondary">Voltar</a>
    </form>

    <h2>Lista de Alunos</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>E-mail</th>
          <th>CPF</th>
          <th>Curso</th>
          <th>Instituição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaAlunos"></tbody>
    </table>
  </div>

  <script src="/app.js"></script>
</body>
</html>
