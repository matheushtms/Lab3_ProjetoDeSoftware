<div class="login-page">
  <section class="hero">
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <div class="brand">Moeda Estudantil</div>
      <h1>Reconheça o mérito.</h1>
      <p>
        Um sistema para distribuir moedas virtuais, premiar boas atitudes e trocar
        vantagens entre alunos, professores e parceiros.
      </p>
    </div>
  </section>

  <section class="panel">
    <div class="card">
      <div class="tabs">
        <button type="button" [class.active]="aba === 'cadastro'" (click)="aba = 'cadastro'">
          Criar conta
        </button>
        <button type="button" [class.active]="aba === 'login'" (click)="aba = 'login'">
          Entrar
        </button>
      </div>

      <p class="message success" *ngIf="mensagem">{{ mensagem }}</p>
      <p class="message error" *ngIf="erro">{{ erro }}</p>

      <ng-container *ngIf="aba === 'cadastro'; else loginTpl">
        <h2>Cadastro</h2>

        <form (ngSubmit)="salvarCadastro()">
          <label for="perfil">Perfil</label>
          <select
            id="perfil"
            [(ngModel)]="cadastro.perfil"
            name="cadastroPerfil"
            required
          >
            <option value="aluno">Aluno</option>
            <option value="professor">Professor</option>
            <option value="parceiro">Empresa parceira</option>
          </select>

          <label for="nome">Nome</label>
          <input
            id="nome"
            type="text"
            [(ngModel)]="cadastro.nome"
            name="cadastroNome"
            required
          />

          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="cadastro.email"
            name="cadastroEmail"
            required
          />

          <label for="cpf">CPF</label>
          <input
            id="cpf"
            type="text"
            [(ngModel)]="cadastro.cpf"
            name="cadastroCpf"
            required
          />

          <label for="rg">RG</label>
          <input
            id="rg"
            type="text"
            [(ngModel)]="cadastro.rg"
            name="cadastroRg"
            required
          />

          <label for="endereco">Endereço</label>
          <input
            id="endereco"
            type="text"
            [(ngModel)]="cadastro.endereco"
            name="cadastroEndereco"
            required
          />

          <label for="curso">Curso</label>
          <input
            id="curso"
            type="text"
            [(ngModel)]="cadastro.curso"
            name="cadastroCurso"
          />

          <label for="senha">Senha</label>
          <input
            id="senha"
            type="password"
            [(ngModel)]="cadastro.senha"
            name="cadastroSenha"
            required
          />

          <label for="instituicaoId">Instituição ID</label>
          <input
            id="instituicaoId"
            type="number"
            [(ngModel)]="cadastro.instituicaoId"
            name="cadastroInstituicaoId"
            required
          />

          <button type="submit">Criar conta</button>
        </form>
      </ng-container>

      <ng-template #loginTpl>
        <h2>Entrar</h2>

        <form (ngSubmit)="entrar()">
          <label for="loginPerfil">Perfil</label>
          <select
            id="loginPerfil"
            [(ngModel)]="loginPerfil"
            name="loginPerfil"
            required
          >
            <option value="aluno">Aluno</option>
            <option value="professor">Professor</option>
            <option value="parceiro">Empresa parceira</option>
          </select>

          <label for="loginEmail">Email</label>
          <input
            id="loginEmail"
            type="email"
            [(ngModel)]="loginEmail"
            name="loginEmail"
            required
          />

          <label for="loginSenha">Senha</label>
          <input
            id="loginSenha"
            type="password"
            [(ngModel)]="loginSenha"
            name="loginSenha"
            required
          />

          <button type="submit">Entrar</button>
        </form>
      </ng-template>
    </div>
  </section>
</div>
